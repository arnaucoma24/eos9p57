Identifier: eos9p57
Slug: crem-grow
Status: In progress
Title: CReM Growth-Based Structure Generation
Description: Generates new drug-like analogues of an input molecule by attaching
  small fragments (1-2 heavy atoms) from a curated ChEMBL-derived fragment 
  database to available hydrogen positions. Every atom and bond of the original 
  molecule is preserved unchanged, so the whole input structure is guaranteed to
  appear intact within each output. Uses the GROW mode of the CReM framework; up
  to 100 diverse analogues are returned per input, selected via K-Means 
  clustering when more are generated.
